name: Build Android APK
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract zip
        run: |
          for f in *.zip; do
            [ -f "$f" ] && unzip -o "$f"
          done
          [ -d "VoiceReminderApp" ] && cp -rn VoiceReminderApp/* . || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.6
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceReminder-APK
          path: app/build/outputs/apk/debug/*.apk
